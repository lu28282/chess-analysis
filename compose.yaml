# Long-running web UI: docker compose up opens http://localhost:8000 with all
# pipeline steps runnable from the browser.
#
# One-shot jobs also work directly:
#   docker compose run fetch
#   docker compose run analyze analyze --limit 10
#   docker compose run report-mistakes report-mistakes --output x.html
x-chess: &chess
  build: .
  image: chess-analysis
  environment:
    CHESS_ANALYSIS_CONFIG: /config/chess-analysis.toml
  volumes:
    - ./data:/app/data
    # read-write: the web UI settings page / setup wizard writes the TOML config
    - ./config:/config
    - ./reports:/app/reports

services:
  web:
    <<: *chess
    command: serve
    ports:
      - "8000:8000"

  fetch:
    <<: *chess
    profiles: [cli]
    command: fetch

  analyze:
    <<: *chess
    profiles: [cli]
    command: analyze
    # pass extra args (the command repeats the subcommand):
    #   docker compose run analyze analyze --limit 10
    #   docker compose run fetch fetch --months 6

  report-mistakes:
    <<: *chess
    profiles: [cli]
    command: report-mistakes

  report-openings:
    <<: *chess
    profiles: [cli]
    command: report-openings

  build-opening-book:
    <<: *chess
    profiles: [cli]
    command: build-opening-book
