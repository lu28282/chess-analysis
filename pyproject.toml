[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chess-analysis"
version = "0.1.0"
description = "Personal chess game analysis: fetch chess.com games, review with Stockfish, HTML reports"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.10",
    "typer>=0.12",
    "tomli-w>=1.0",
    "requests>=2.31",
]

[project.scripts]
chess-analysis = "chess_analysis.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
